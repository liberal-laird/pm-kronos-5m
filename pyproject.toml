[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_kronos"]

[project]
name = "btc-updown-5m"
version = "0.1.0"
description = "加密 5m 涨跌预测：币安 K 线 + Kronos 模型"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "einops==0.8.1",
    "huggingface_hub>=0.33.0",
    "safetensors>=0.6.0",
    "tqdm>=4.67.0",
    "py-clob-client",
    "python-dotenv>=1.0.0",
    "py-builder-relayer-client",
    "py-builder-signing-sdk",
    "eth-utils",
    "web3>=6.0.0",
    "eth-account>=0.13.0",
]
